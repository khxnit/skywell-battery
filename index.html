<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skywell ติดตามแบตเตอรี่แพค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17242d;--mute:#5d6e78;--paper:#eef2f1;--card:#fff;--line:#d3dcdd;--ok:#2c8a5a;--wip:#d38a12;--sk:#1f64a8;--bad:#b4402f;
--okbg:#e2f1e8;--wipbg:#fbefd5}
@media(prefers-color-scheme:dark){:root{--ink:#e6eef0;--mute:#9fb0b8;--paper:#11191e;--card:#1a252c;--line:#2c3b44;--ok:#4fc28a;--wip:#ecaa3a;--sk:#6bb0ee;--bad:#e8806e;--okbg:#17352a;--wipbg:#3b2f14}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--sk);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 20px}
header h1{font-size:1.05rem;margin:0;font-weight:600}
header nav{display:flex;gap:4px}
header nav a{padding:6px 12px;border-radius:6px;text-decoration:none;color:inherit;opacity:.8}
header nav a[aria-current]{background:rgba(255,255,255,.16);opacity:1}
header input{margin-left:auto;min-width:180px;padding:7px 10px;border-radius:6px;border:0;font:inherit;background:#fff;color:#17242d}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:1.5rem;margin:0 0 4px;font-weight:600}
h3{font-size:1rem;margin:26px 0 8px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
.mute{color:var(--mute)}
.crumb{font-size:.9rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.car{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:12px 14px;text-decoration:none}
.car.wip{border-left-color:var(--wip)}
.car:hover{border-color:var(--sk)}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;margin-bottom:10px}
.ch b{font-size:1.15rem;font-weight:600}
.chip{white-space:nowrap;font-size:.78rem;padding:1px 9px;border-radius:99px;background:var(--okbg);color:var(--ok);font-weight:500}
.chip.wip{background:var(--wipbg);color:var(--wip)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.strip i{height:22px;border-radius:2px;background:var(--ok)}
.strip i.wip{background:var(--wip)}
.strip i.empty,.slot.empty{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 6px);border:1px dashed var(--bad)}
.strip i.sk{box-shadow:inset 0 -6px 0 var(--sk)}
.truck{color:var(--ok);flex:none}
.car.wip .truck,.hd.wip .truck{color:var(--wip)}
.who{display:flex;align-items:center;gap:10px;white-space:nowrap}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.pad{padding:12px 14px;margin:0}
.cf{font-size:.85rem;color:var(--mute);margin-top:8px}
.rack{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.slot{display:block;border-radius:8px;padding:12px 10px;min-height:92px;text-decoration:none;background:var(--okbg);border:1px solid var(--ok);color:var(--ink)}
.slot.wip{background:var(--wipbg);border-color:var(--wip)}
.slot .n{font-size:.8rem;color:var(--mute)}
.slot .l{font-size:1.2rem;font-weight:600;margin-top:6px}
.slot.sk{box-shadow:inset 0 -6px 0 var(--sk)}
.slot.sk .l{color:var(--sk)}
.slot.empty .l{color:var(--bad);font-size:1rem}
a.slot:hover{outline:2px solid var(--sk)}
.plan{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.plan svg{display:block;width:100%;max-width:400px;margin:0 auto;height:auto}
.tk{fill:none;stroke:var(--mute);stroke-opacity:.5;stroke-width:1.6}
.tk .d{stroke-dasharray:5 4;stroke-opacity:.4}
.tl text{font-size:11.5px;fill:var(--mute);text-anchor:middle;opacity:.9}
.pk .f{stroke:rgba(0,0,0,.55);stroke-width:1.2}
.pk.ok .f{fill:#7fcda5}.pk.wip .f{fill:#f4cb78}
.pk.empty .f{fill:rgba(180,64,47,.1);stroke:var(--bad);stroke-dasharray:4 3}
.pk.sk .f{stroke:var(--sk);stroke-width:2.6}
.pk text{text-anchor:middle;fill:#12232c;pointer-events:none}
.pk .n{font-size:16px;font-weight:600}.pk .s{font-size:10.5px}
.pk.sk .s{font-weight:600;fill:#0f3d73}
.pk.empty text{fill:var(--bad)}
a:hover .pk .f{stroke-width:3.4}
.cl{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.vt{display:flex;gap:6px;margin-bottom:8px}
.bt{font:inherit;padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.vw[data-v="3d"] .bt[data-m="3d"],.vw[data-v="top"] .bt[data-m="top"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vw[data-v="3d"] .plan,.vw[data-v="top"] .iso{display:none}
.iso{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
.iso svg{display:block;min-width:700px;width:100%;max-width:1120px;height:auto;margin:0 auto}
.tk polyline{fill:none}.tk .d{stroke-dasharray:5 4;stroke-opacity:.45}.tk .cy{stroke-width:5;stroke-linecap:round;stroke-opacity:.35}
.pk.ok .f.t{fill:#9be3c4}.pk.ok .f.l{fill:#5cc19a}.pk.ok .f.r{fill:#3fa27d}
.pk.wip .f.t{fill:#ffdc92}.pk.wip .f.l{fill:#f2b84b}.pk.wip .f.r{fill:#d99620}
.pk .f{stroke:#17433a;stroke-width:1;stroke-linejoin:round}
.pk.sk .f{stroke:var(--sk);stroke-width:2}
.pk .bd{fill:#fff;stroke:#14313a;stroke-width:1.4}.pk.sk .bd{stroke:var(--sk);stroke-width:2}.pk.empty .bd{stroke:var(--bad)}
.pk .bn{font-size:16px;font-weight:700;fill:#102a33}
.pk .bv{font-size:12px;font-weight:700;fill:var(--bad)}
.gnd{fill:rgba(0,0,0,.045);stroke:none}
.bw{fill:rgba(120,140,155,.07);stroke:var(--mute);stroke-opacity:.5;stroke-width:1.2}.bw.d{stroke-dasharray:5 4;fill:rgba(120,140,155,.05)}
.cab{fill:rgba(120,140,155,.12);stroke:var(--mute);stroke-opacity:.65;stroke-width:1.3}.cab.t{fill:rgba(120,140,155,.2)}.cab.w{fill:rgba(110,160,200,.18)}
.tire{fill:#9aa6ae;stroke:#566670;stroke-width:1}.tface{fill:#c4ccd1;stroke:#566670}.trim{fill:#e6eaec;stroke:#667781}.thub{fill:#8a979f;stroke:none}
@media(prefers-color-scheme:dark){.tire{fill:#2f3c45}.tface{fill:#46555f}.trim{fill:#5a6a75}.thub{fill:#7d8d98}}
.far{opacity:.5}
.rail{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1.3}
.cyo{fill:none;stroke:var(--mute);stroke-opacity:.55;stroke-width:8;stroke-linecap:round}.cyi{fill:none;stroke:var(--card);stroke-width:4;stroke-linecap:round}
.lead{fill:none;stroke:var(--mute);stroke-opacity:.6;stroke-width:1;stroke-dasharray:3 3}
.gd{fill:var(--ink);fill-opacity:.05;stroke:none}.tk .rb{stroke-opacity:.3}
.pc{fill:#fff;stroke-width:2.6}.pk.ok .pc{stroke:#2f8b5f}.pk.wip .pc{stroke:#c98a22}.pk.empty .pc{stroke:var(--bad);stroke-dasharray:3 2}.pk.sk .pc{stroke:var(--sk);stroke-width:3.2}
.ld{stroke:var(--mute);stroke-width:1;fill:var(--mute)}.pk .pn{font-size:14px;font-weight:700}
.pk .n3{font-size:17px;font-weight:700}.pk .s3{font-size:11px;font-weight:600}
.pill{fill:#fff;stroke:var(--sk);stroke-width:1.2}
.pk .pt{font-size:11.5px;font-weight:700;fill:#0f3d73}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--mute);margin:12px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.todo{background:var(--card);border:1px solid var(--line);border-radius:8px}
.todo a{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 14px;text-decoration:none;border-top:1px solid var(--line)}
.todo a:first-child{border-top:0}
.todo a:hover{background:var(--paper)}
.todo b{color:var(--sk);min-width:56px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);font-size:.95rem}
th{font-weight:500;color:var(--mute);border-top:0;background:var(--paper)}
.wrap{overflow-x:auto}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters a{padding:5px 14px;border:1px solid var(--line);border-radius:99px;text-decoration:none;background:var(--card)}
.filters a[aria-current]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.round{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.round>h4{margin:0;padding:8px 14px;font-size:.95rem;background:var(--paper);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(3,1fr)}
.cols>div{padding:12px 14px;border-left:1px solid var(--line)}
.cols>div:first-child{border-left:0}
.cols h5{margin:0 0 6px;font-size:.9rem;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.93rem}
dt{color:var(--mute)}dd{margin:0}
.ok{color:var(--ok);font-weight:500}.wipc{color:var(--wip);font-weight:500}
.unc{color:var(--mute)}
.log{list-style:none;padding:0;margin:0}
.log li{padding:8px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
footer{color:var(--mute);font-size:.85rem;margin-top:36px}
@media(max-width:720px){.cl{grid-template-columns:1fr}.two{grid-template-columns:1fr}.rack{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}.cols>div{border-left:0;border-top:1px solid var(--line)}.cols>div:first-child{border-top:0}header input{margin-left:0;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Skywell แบตเตอรี่แพค</h1>
  <nav aria-label="เมนูหลัก"><a href="#/" id="n-home">ฟลีต</a><a href="#/packs" id="n-packs">แพค SK ทั้งหมด</a></nav>
  <input id="q" list="sklist" placeholder="ค้นหา SK เช่น SK-01" aria-label="ค้นหาแพค SK">
  <datalist id="sklist"></datalist>
</header>
<main id="app"></main>

<script>
/* ข้อมูลตัวอย่างจากไฟล์ skywell_battery_monitor.xlsx
   ขั้นต่อไปจะเปลี่ยนส่วนนี้เป็นการอ่านจาก Google Sheets หรือไฟล์ data.json */
const D={
 updated:"2026-10-08",
 cars:["08-178","08-189","08-190","08-191","08-192","08-193","08-194","08-195","08-196","08-197","08-198"],
 wip:{},   // ช่องที่ตั้งสถานะ "กำลังดำเนินการ" (กรอกเองจากหน้า 1)
 rounds:[
  {"sk":"SK-01","n":1,"from":"08-192","fromPack":4,"date":"2026-10-06","meter":null,"symptom":"Vdiff","cd":"ผ่าน","soh":90,"ah":207,"bal":"ผ่าน","to":"08-194","toPack":1,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-02","n":1,"from":"08-192","fromPack":5,"date":"2026-10-06","meter":null,"symptom":"Vdiff","cd":"ผ่าน","soh":90,"ah":207,"bal":"ผ่าน","to":"08-194","toPack":2,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-03","n":1,"from":"08-192","fromPack":6,"date":"2026-10-06","meter":null,"symptom":"Vdiff","cd":"ผ่าน","soh":90,"ah":207,"bal":"ผ่าน","to":"08-194","toPack":3,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-04","n":1,"from":"08-194","fromPack":1,"date":"2026-10-06","meter":null,"symptom":"Vdiff","cd":"กำลังดำเนินการ","soh":null,"ah":null,"bal":"รอดำเนินการ","to":"","toPack":null,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-05","n":1,"from":"08-194","fromPack":2,"date":"2026-10-06","meter":null,"symptom":"Vdiff","cd":"กำลังดำเนินการ","soh":null,"ah":null,"bal":"รอดำเนินการ","to":"","toPack":null,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-06","n":1,"from":"08-194","fromPack":3,"date":"2026-10-06","meter":null,"symptom":"Vdiff","cd":"กำลังดำเนินการ","soh":null,"ah":null,"bal":"รอดำเนินการ","to":"","toPack":null,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-01","n":2,"from":"08-194","fromPack":1,"date":"","meter":null,"symptom":"Vdiff","cd":"กำลังดำเนินการ","soh":null,"ah":null,"bal":"รอดำเนินการ","to":"","toPack":null,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-02","n":2,"from":"08-194","fromPack":2,"date":"","meter":null,"symptom":"Vdiff","cd":"กำลังดำเนินการ","soh":null,"ah":null,"bal":"รอดำเนินการ","to":"","toPack":null,"toDate":null,"toMeter":null,"link":""},
  {"sk":"SK-03","n":2,"from":"08-194","fromPack":3,"date":"","meter":null,"symptom":"Vdiff","cd":"กำลังดำเนินการ","soh":null,"ah":null,"bal":"รอดำเนินการ","to":"","toPack":null,"toDate":null,"toMeter":null,"link":""}
 ]};

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>d?d.split("-").reverse().join("/"):"—", fm=m=>m==null||m===""?"—":Number(m).toLocaleString("en");
const tc=v=>v==="ผ่าน"?"ok":v?"wipc":"mute";

/* คำนวณว่าตอนนี้แต่ละช่องมีแพคอะไร จากประวัติการถอด/ติดตั้งทั้งหมด */
function slots(){
 const S={};D.cars.forEach(c=>S[c]=Array(12).fill("เดิม"));
 const ev=[];
 D.rounds.forEach(r=>{ev.push({t:0,d:r.date,r});if(r.to)ev.push({t:1,d:r.toDate||r.date,r});});
 D.undated=ev.some(e=>!e.d);   // ถ้ามีรอบที่ไม่ระบุวันที่ ใช้ลำดับ "รอบที่" แทนวันที่
 const key=e=>D.undated?e.r.n:e.d;
 ev.sort((a,b)=>(key(a)<key(b)?-1:key(a)>key(b)?1:0)||a.t-b.t||a.r.sk.localeCompare(b.r.sk));
 ev.forEach(e=>{const r=e.r,c=e.t===0?r.from:r.to,p=(e.t===0?r.fromPack:r.toPack)-1;if(S[c]&&p>=0&&p<12)S[c][p]=e.t===0?null:r.sk;});
 return S;
}
const last=sk=>D.rounds.filter(r=>r.sk===sk).sort((a,b)=>a.n-b.n).pop();
const sks=()=>[...new Set(D.rounds.map(r=>r.sk))].sort();
const isWip=(c,i)=>(D.wip[c]||[]).includes(i+1);
const cls=(c,i,x)=>x===null?"empty":(isWip(c,i)?"wip":"ok")+(x!=="เดิม"?" sk":"");
const carState=(S,c)=>S[c].some((x,i)=>x===null||isWip(c,i))?"wip":"ok";
const stText=s=>s==="ok"?"ปกติ":"กำลังดำเนินการ";

const truck=(w=46)=>`<svg class="truck" width="${w}" height="${Math.round(w/2)}" viewBox="0 0 64 32" role="img" aria-label="รถดั๊ม"><path d="M3 5h33l-3 17H3z" fill="currentColor"/><path d="M38 10h11l7 8v4H38z" fill="currentColor"/><path d="M42 13h6l4 5h-10z" fill="var(--card)"/><rect x="2" y="22" width="55" height="3" rx="1" fill="currentColor"/><g fill="var(--ink)"><circle cx="11" cy="26" r="5"/><circle cx="24" cy="26" r="5"/><circle cx="48" cy="26" r="5"/></g><g fill="var(--card)"><circle cx="11" cy="26" r="1.8"/><circle cx="24" cy="26" r="1.8"/><circle cx="48" cy="26" r="1.8"/></g></svg>`;
/* ผังตำแหน่งแพคบนรถดั๊ม (มองจากด้านบน หน้ารถอยู่ด้านบนของภาพ)
   5-8 = ด้านซ้ายระหว่างล้อหน้า-หลัง, 9-12 = ด้านขวา, 1-4 = หลังหัวเก๋งใกล้กระบอกยก
   ลำดับในแต่ละกลุ่มปรับได้ที่ 3 บรรทัดนี้ (เรียงจากหน้ารถไปท้ายรถ) */
const ORDER={left:[5,6,7,8],right:[9,10,11,12],back:[4,2,3,1]};
function planSVG(id,S){
 const pk=[];
 ORDER.left.forEach((n,i)=>pk.push({n,x:62,y:148+i*56,w:56,h:50}));
 ORDER.right.forEach((n,i)=>pk.push({n,x:242,y:148+i*56,w:56,h:50}));
 ORDER.back.forEach((n,i)=>pk.push({n,x:124+(i%2)*60,y:148+Math.floor(i/2)*44,w:52,h:36}));
 const outline=`<g class="tk"><rect x="84" y="16" width="192" height="92" rx="16"/><path d="M100 36h160"/><rect x="70" y="124" width="220" height="398" rx="8" class="d"/>
  <rect x="34" y="46" width="22" height="52" rx="4"/><rect x="304" y="46" width="22" height="52" rx="4"/>
  <rect x="26" y="392" width="14" height="74" rx="4"/><rect x="42" y="392" width="14" height="74" rx="4"/><rect x="304" y="392" width="14" height="74" rx="4"/><rect x="320" y="392" width="14" height="74" rx="4"/>
  <path d="M56 72h248M56 429h248" class="d"/><rect x="170" y="236" width="20" height="58" rx="5"/></g>
  <g class="tl"><text x="180" y="92">หัวเก๋ง (หน้ารถ)</text><text x="90" y="140">ด้านซ้าย</text><text x="270" y="140">ด้านขวา</text><text x="180" y="140">หลังหัวเก๋ง</text><text x="180" y="310">กระบอกยกดั๊ม</text></g>`;
 const cells=pk.map(b=>{
  const v=S[id][b.n-1],st=v===null?"empty":isWip(id,b.n-1)?"wip":"ok",sk=!!v&&v!=="เดิม",lab=v===null?"ว่าง":sk?v:"เดิม",cx=b.x+b.w/2,cy=b.y+b.h/2;
  const g=`<g class="pk ${st}${sk?" sk":""}"><title>pack ${b.n}: ${v===null?"ว่าง (ถอดออกแล้ว)":lab}${st==="wip"?" (กำลังดำเนินการ)":""}</title><rect class="f" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6"/><text class="n" x="${cx}" y="${cy-1}">${b.n}</text><text class="s" x="${cx}" y="${cy+13}">${lab}</text></g>`;
  return sk?`<a href="#/pack/${v}">${g}</a>`:g}).join("");
 return `<svg viewBox="0 0 360 540" role="group" aria-label="ผังแพคบนรถ ${id}">${outline}${cells}</svg>`}
/* มุม 3 มิติ: มองจากท้ายรถด้านซ้ายลงมา (หน้ารถอยู่ซ้ายบน เหมือนภาพตัวอย่าง) หน่วยเป็นเมตร
   a = ระยะจากท้ายรถไปหน้ารถ, b = ระยะจากด้านซ้ายของรถไปด้านขวา, z = ความสูง
   แพคจริงขนาด 630 x 1100 x 250 มม. ก้อน 5 และ 9 วางซ้อนข้างบนและวางขวางกับก้อนล่าง */
function iso3d(id,S){
 const s=80,CX=.848,SY=.53,SP=.6,ZZ=.8,P=(a,b,z)=>[(b*SY-a*CX)*s,-(a*SY+b*CX)*SP*s-z*ZZ*s],f=n=>n.toFixed(1),pts=q=>q.map(p=>f(p[0])+","+f(p[1])).join(" "),all=[];

  const a=(r[0]||"").trim();if(/^\d+$/.test(a)){n=+a;inst=false}
  const L=(r[1]||"").trim().toLowerCase();if(!n||!L)return;
  const k=L.startsWith("มาจาก")?"from":L.startsWith("แพค")?(inst?"toPack":"fromPack"):L.startsWith("วันที่")?(inst?"toDate":"date"):L.startsWith("มิเตอร์")?(inst?"toMeter":"meter"):L.startsWith("อาการ")?"symptom":L.startsWith("charge")?"cd":L.startsWith("soh")?"soh":L.startsWith("capacity")?"ah":L.startsWith("balancing")?"bal":L.startsWith("นำไปติดตั้ง")?"to":L.startsWith("link")?"link":null;
  if(k)cols.forEach(([i,sk])=>{B[n]=B[n]||{};B[n][sk]=B[n][sk]||{};B[n][sk][k]=(r[i]||"").trim()});
  if(L.startsWith("นำไปติดตั้ง"))inst=true;
 });
 const out=[];
 Object.keys(B).map(Number).sort((x,y)=>x-y).forEach(n=>{for(const sk in B[n]){const o=B[n][sk];if(!o.from)continue;
  out.push({sk,n,from:o.from,fromPack:num(o.fromPack),date:iso(o.date)||"",meter:num(o.meter),symptom:o.symptom||"",cd:o.cd||"",soh:pct(o.soh),ah:num(o.ah),bal:o.bal||"",
   to:o.to||"",toPack:num(o.toPack),toDate:iso(o.toDate),toMeter:num(o.toMeter),link:o.link||""})}});
 return out}
/* อ่านหน้า 1: แถวที่คอลัมน์ B เป็นเลขรถ แล้วคอลัมน์ C-N คือสถานะ Pack 1-12 */
function parseStatus(rows){const cars=[],wip={};
 rows.forEach(r=>{const c=(r[1]||"").trim();if(/^\d{2}-\d+$/.test(c)){cars.push(c);r.slice(2,14).forEach((s,i)=>{if(/กำลัง/.test(s||""))(wip[c]=wip[c]||[]).push(i+1)})}});
 return{cars,wip}}
let loadErr=false;
async function load(){
 if(!SHEET_ID)return;
 $("#app").innerHTML='<p class="mute">กำลังโหลดข้อมูลจาก Google Sheets…</p>';
 try{
  const [s,p]=await Promise.all([TABS.status,TABS.packs].map(t=>fetch(csvUrl(t)).then(r=>{if(!r.ok)throw new Error(t);return r.text()})));
  const st=parseStatus(parseCSV(s));D.cars=[...new Set([...D.cars,...st.cars])].sort();D.wip=st.wip;
  D.rounds=parsePacks(parseCSV(p));
  D.updated=new Date().toISOString().slice(0,10);
 }catch(e){loadErr=true}
}
addEventListener("hashchange",route);
load().then(route);
</script>
